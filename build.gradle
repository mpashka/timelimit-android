// AGP 9.x — первая ветка плагина, которая живёт на публичном API gradle: 8.x обращался к
// org.gradle.api.problems.internal.InternalProblems, удалённому в gradle 9.6
// (https://docs.gradle.org/9.7.1/userguide/upgrading_version_9.html#agp_8x_incompatible).
// Kotlin в AGP 9 встроенный, поэтому плагина org.jetbrains.kotlin.android тут больше нет;
// kapt даёт штатный com.android.legacy-kapt той же версии.
plugins {
    id 'com.android.application' version '9.4.1' apply false
    id 'com.android.library' version '9.4.1' apply false
    id 'com.android.legacy-kapt' version '9.4.1' apply false
    id 'org.jetbrains.kotlin.jvm' version "2.4.21" apply false
    id 'org.jetbrains.kotlin.plugin.compose' version "2.4.21" apply false
    id 'androidx.navigation.safeargs' version '2.9.7' apply false
    id 'com.squareup.wire' version '7.1.2' apply false
}